name: EXP-0054
hypothesis: H45
title: BBO/top-3 imbalance agreement state at frozen MAT + CFADE triggers (stratum only)
description: >
  Tier A / A4 (CORRELATED_IDEAS S1.3 Claim A). STRATUM ONLY — no standalone
  entry, no ship from this experiment. Per market, from a depth-replayed
  book (seeded pre-window): per completed second,
  imb = (bid_topK - ask_topK) / (bid_topK + ask_topK) over the K best
  bid/ask levels; feature at a trigger = mean imb over the trailing
  window_sec completed seconds (defined if >= min_defined_sec are defined
  and the book is not empty/crossed). Lean: >= +lean_cut bid,
  <= -lean_cut ask, else neutral. Two markets classified as agree_bid /
  agree_ask / disagree / neutral (absolute), and side-relative to the
  trigger as agree_with / agree_against / other / warmup.
  Trigger set: every frozen MAT signal and every frozen CFADE candidate
  on the DIG4 23d sessions with NQ+ES depth; triggers on sessions without
  depth are reported as uncovered, not dropped silently.
  Sequential: Stage 0 coverage (defined-state share per trigger set) +
  causality (truncation invariance; chunked vs brute-force replay
  hand-check); Stage 1 joined frozen-book trades by side-relative state
  (MAT and CFADE). A state MATTERS on a book iff agree_with n >=
  min_state_trades, avg >= rest avg + mde_avg_lift_pts, and the direction
  holds in both train and hold. Even a matters verdict ships nothing:
  the state only earns candidate status for the Tier B execution-timer
  preregistration. No May read for A4 alone; no window/depth/lean-cut
  retune on this sample.
  NOTE (2026-10-24): this YAML was reconstructed after a numbering
  collision with EXP-0055 briefly overwrote it; design values are as
  frozen (runner defaults + TIER_A A4 + EXPERIMENT_LOG run note).

detector: correlated_book_agreement  # runner: research/correlated/exp_0054_book_agreement.py
bar_ms: 100
slip_ticks: 1.0
commission_pts_rt: 0.25
signal_cooldown_sec: 5.0
horizons_ms: [10000, 60000]
point_targets: [5, 10, 20]

min_state_trades: 20
mde_avg_lift_pts: 1.0

book_agreement:
  window_sec: 5
  top_levels: 3
  lean_cut: 0.20
  min_defined_sec: 3

cfade_exhaust:
  nq_min_imbalance: 0.55
  nq_min_vol: 25
  nq_min_trades: 6
  es_imb_max: -0.4
  es_min_vol: 0
  use_imb: true
  use_vol: false
  max_wait_sec: 0
  skip_bars: 0
cfade_max_wait_sec: 5.0
cfade_er_max: 0.30

exclude_sessions: []
run_may: false
