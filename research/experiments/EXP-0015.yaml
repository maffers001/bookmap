name: EXP-0015
hypothesis: H10
title: CD Bollinger-width regime filter on ES+NQ momentum
description: >
  Stratify EXP-0008-style ES+NQ tape momentum by causal CD BB width percentile.
  H0: wide regime (pct>=0.70) improves continuation vs narrow (pct<=0.30) and vs all.

detector: momentum_bb_regime
bar_ms: 100
min_trades: 6
min_vol: 25
min_imbalance: 0.55
min_progress_ticks: 1.0
sync_ms: 1500
max_es_lag_ms: 250
range_ticks: 22
tick_size: 1.0
sma_len: 100
regime_pct_lookback: 100
wide_pct: 0.70
narrow_pct: 0.30
rth_uk_only: true
horizons_ms: [250, 500, 1000, 2000, 5000, 10000]
point_targets: [10, 20]
