name: EXP-0020
hypothesis: H15
title: Near-book depth imbalance (ask vs bid within X ticks)
description: >
  Causal L2 imbalance in a band of tick_radius above/below mid.
  imbalance = (ask_near - bid_near) / (ask_near + bid_near).
  Pressure interpretation: ask-heavy → short continuation; bid-heavy → long.
  Also report magnet (fade into heavy side). Dual ES+NQ same-side sync.

detector: book_imbalance
tick_radius: 10
sample_ms: 100
min_abs_imbalance: 0.45
min_total_size: 20
cooldown_ms: 1000
interpretation: pressure
also_magnet: true
sync_ms: 1500
max_es_lag_ms: 250
rth_uk_only: true
horizons_ms: [250, 500, 1000, 2000, 5000, 10000, 20000, 30000, 60000]
point_targets: [5, 10, 20, 30]
