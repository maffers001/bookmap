name: EXP-0005
hypothesis: H2
title: Absorption — high execute-into / low penetration vs fade-the-level returns
description: >
  Track large near-BBO resting levels. When executed volume into the level
  reaches initial size with low penetration (<= tick_radius/2), fade the level
  (BID absorb → long, ASK absorb → short). Absolute size gate only: z-score
  disabled (z_score=99) because default z=2.5 floods ~10-lot book noise on NQ.

detector: absorption
absolute_size: 50
z_score: 99.0
tick_radius: 8
min_consume_ratio: 1.0
role: NQ
rth_uk_only: true
horizons_ms: [250, 500, 1000, 2000, 5000, 10000, 20000, 30000, 60000]
point_targets: [5, 10, 20, 30]
