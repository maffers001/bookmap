name: EXP-0025
hypothesis: H19
title: Swing-break filter on lag<250 momentum
description: >
  Causal swing (lookback extreme confirmed 20s). Keep EXP-0008 lag<250 bursts
  that break the last confirmed swing in trade direction. Compare break-through
  vs non-break vs null. One dig: lookback 2m/3m/5m.

detector: swing_break_momentum
bar_ms: 100
min_trades: 6
min_vol: 25
min_imbalance: 0.55
min_progress_ticks: 1.0
sync_ms: 1500
max_es_lag_ms: 250
swing_lookback_ms: 180000
swing_confirm_ms: 20000
break_ticks: 1.0
tick_size: 1.0
rth_uk_only: true
horizons_ms: [250, 500, 1000, 2000, 5000, 10000, 20000, 30000, 60000]
point_targets: [5, 10, 20, 30]
